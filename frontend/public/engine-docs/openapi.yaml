openapi: 3.0.0
info:
  title: Bubbles Trading Engine — REST API
  description: |
    REST surface of the Bubbles matching engine. The engine runs on the user's own
    machine and is reached directly; there is no hosted gateway in front of it.

    This file is maintained by hand against
    `trading_engine/src/server/rest_handlers.cpp`. If you change a route there,
    change it here too.

    ## Authentication

    Header-only, in either of two forms:

        Authorization: Bearer <api-key>
        Api-Key: <api-key>

    Query-string auth (`?api_key=`) is deliberately **not** accepted: URLs leak into
    proxy and browser-history logs, and a query-param POST is a "simple" CORS request
    that skips preflight. See `extractApiKeyFromHttp` in
    `src/auth/api_key_authenticator.cpp`, guarded by the `ignores_query_string_api_key`
    test.

    Most read endpoints are anonymous-friendly. Where a key is optional, supplying an
    invalid one is still rejected with 401.

    ## Real-time data

    Order book and trade streams are WebSocket-only, at `ws://<host>:<port>/` — the
    root path. This document covers the REST surface only.
  version: 1.0.0

servers:
  - url: http://localhost:9090
    description: Local engine (default port)

tags:
  - name: Health
  - name: Market Data
  - name: Bots
  - name: Account

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: No database or network access; proves only that the process is up.
      responses:
        '200':
          description: Engine is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }

  /status:
    get:
      tags: [Health]
      summary: Server status and metrics
      responses:
        '200':
          description: Status envelope with the metrics object embedded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: running }
                  port: { type: integer, example: 9090 }
                  version:
                    type: string
                    description: Injected at build time from CMake PROJECT_VERSION.
                    example: 1.0.0
                  uptime_seconds: { type: integer, example: 42 }
                  metrics: { $ref: '#/components/schemas/Metrics' }

  /metrics:
    get:
      tags: [Health]
      summary: Counters since process start
      responses:
        '200':
          description: Counters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Metrics' }

  /symbols:
    get:
      tags: [Market Data]
      summary: Configured symbol registry
      description: |
        The instruments this engine was started with, from `server.json`. Clients should
        read this rather than hardcoding a symbol list — the set is deployment-specific.
        `max_long` / `max_short` appear only when a position cap is configured.
      responses:
        '200':
          description: Registry as configured at boot
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbols:
                    type: array
                    items: { $ref: '#/components/schemas/Symbol' }
              example:
                symbols:
                  - { name: ES, id: 1, mid: 7400, max_long: 100, max_short: 100 }
                  - { name: NKD, id: 2, mid: 67475 }
                  - { name: SPY, id: 6, mid: 740 }

  /orderbook:
    get:
      tags: [Market Data]
      summary: L2 order book snapshot
      description: |
        Latest snapshot from the in-memory cache. `symbol` is required — a book is
        per-instrument and there is no default.
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
          example: ES
      responses:
        '200':
          description: |
            Book snapshot; `bids` descending, `asks` ascending. An unknown symbol returns
            200 with the symbol echoed back and no `bids`/`asks` arrays.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderBook' }
              example:
                symbol: ES
                timestamp: '1777800000000'
                bids: [{ price: 7399.75, size: 10, total: 73997.5 }]
                asks: [{ price: 7400.25, size: 10, total: 74002.5 }]
        '400':
          description: '`symbol` was omitted'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: An API key was supplied but is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /trades:
    get:
      tags: [Market Data]
      summary: Recent trades from the in-memory cache
      description: For history beyond the cache, use `/trades/historical`.
      parameters:
        - name: symbol
          in: query
          required: false
          description: Omit to receive recent trades across all symbols.
          schema: { type: string }
          example: ES
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Most-recent trades
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items: { $ref: '#/components/schemas/Trade' }

  /trades/historical:
    get:
      tags: [Market Data]
      summary: Trades from the persistent SQLite store
      parameters:
        - name: symbol
          in: query
          required: false
          schema: { type: string }
          example: ES
        - name: from
          in: query
          required: false
          description: Lower bound, epoch milliseconds.
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          required: false
          description: Upper bound, epoch milliseconds.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5000, minimum: 1, maximum: 50000 }
      responses:
        '200':
          description: Stored trades
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items: { $ref: '#/components/schemas/Trade' }

  /index-prices:
    get:
      tags: [Market Data]
      summary: Latest upstream index prices the engine fetched
      responses:
        '200':
          description: Index price map

  /bots:
    get:
      tags: [Bots]
      summary: Snapshot of every known bot / strategy
      description: |
        Includes each connected client plus the in-process market maker and news bots.
      parameters:
        - name: window_ms
          in: query
          required: false
          description: Rolling-PnL window. Defaults to one hour.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Bot rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  bots:
                    type: array
                    items: { $ref: '#/components/schemas/Bot' }

  /leaderboard:
    get:
      tags: [Bots]
      summary: Aggregate PnL per user
      description: Aggregated deliberately — no per-bot detail is exposed.
      responses:
        '200':
          description: Leaderboard rows

  /bots/{client_id}/pause:
    post:
      tags: [Bots]
      summary: Pause a strategy
      description: Owner-only; the API key must own the bot.
      security: [{ ApiKeyHeader: [] }, { BearerAuth: [] }]
      parameters:
        - name: client_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Paused }
        '401': { description: Missing or invalid API key }
        '403': { description: Key does not own this bot }

  /bots/{client_id}/resume:
    post:
      tags: [Bots]
      summary: Resume a strategy
      security: [{ ApiKeyHeader: [] }, { BearerAuth: [] }]
      parameters:
        - name: client_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Resumed }
        '401': { description: Missing or invalid API key }
        '403': { description: Key does not own this bot }

  /bots/{client_id}:
    delete:
      tags: [Bots]
      summary: Forget a disconnected bot row
      security: [{ ApiKeyHeader: [] }, { BearerAuth: [] }]
      parameters:
        - name: client_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Removed }
        '401': { description: Missing or invalid API key }
        '403': { description: Key does not own this bot }

  /auth:
    post:
      tags: [Account]
      summary: Validate an API key
      security: [{ ApiKeyHeader: [] }, { BearerAuth: [] }]
      responses:
        '200':
          description: Key is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean, example: true }
                  user_id: { type: string, example: user_abc123 }
        '401': { description: Missing or invalid API key }
        '405': { description: Method other than POST }

  /me:
    get:
      tags: [Account]
      summary: Resolve the calling API key to a user id
      security: [{ ApiKeyHeader: [] }, { BearerAuth: [] }]
      responses:
        '200': { description: Caller identity }
        '401': { description: Missing or invalid API key }

  /me/fills:
    get:
      tags: [Account]
      summary: The caller's own executions, most recent first
      security: [{ ApiKeyHeader: [] }, { BearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Fills belonging to the calling user }
        '401': { description: Missing or invalid API key }

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: Api-Key
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Metrics:
      type: object
      properties:
        uptime_seconds: { type: integer, example: 42 }
        total_connections: { type: integer, example: 17 }
        active_connections: { type: integer, example: 3 }
        total_requests: { type: integer, example: 89 }
        ws_connections: { type: integer, example: 2 }
        orders_accepted: { type: integer, example: 14 }
        orders_rejected: { type: integer, example: 1 }
        trades_matched: { type: integer, example: 11 }

    Symbol:
      type: object
      properties:
        name: { type: string, example: ES }
        id: { type: integer, example: 1 }
        mid: { type: number, example: 7400 }
        max_long:
          type: integer
          description: Present only when a long cap is configured.
        max_short:
          type: integer
          description: Present only when a short cap is configured.

    BookLevel:
      type: object
      properties:
        price: { type: number, example: 7399.75 }
        size: { type: integer, example: 10 }
        total:
          type: number
          description: price × size for this level.
          example: 73997.5

    OrderBook:
      type: object
      properties:
        symbol: { type: string, example: ES }
        timestamp:
          type: string
          description: Epoch milliseconds, sent as a string.
          example: '1777800000000'
        bids:
          type: array
          items: { $ref: '#/components/schemas/BookLevel' }
        asks:
          type: array
          items: { $ref: '#/components/schemas/BookLevel' }

    Trade:
      type: object
      properties:
        trade_id: { type: integer, example: 98 }
        symbol: { type: string, example: ES }
        price: { type: number, example: 7400.25 }
        quantity: { type: integer, example: 50 }
        taker_side: { type: string, enum: [Buy, Sell] }
        ts:
          type: integer
          format: int64
          description: Epoch milliseconds.
          example: 1777800000123

    Bot:
      type: object
      properties:
        user_id: { type: string, example: 'internal:market_maker' }
        client_id: { type: string, example: Market Maker }
        name: { type: string, example: Market Maker }
        strategy_name: { type: string, example: in-process MM }
        is_internal: { type: boolean }
        status: { type: string, example: active }
        paused: { type: boolean }
        orders_placed: { type: integer, example: 1234 }
        fills: { type: integer, example: 56 }
        volume: { type: integer, example: 12340 }
        total_pnl: { type: number, example: 12.34 }
        windowed_pnl: { type: number, example: 4.2 }
